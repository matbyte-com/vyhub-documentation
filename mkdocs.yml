site_name: VyHub Docs
site_url: https://docs.vyhub.net
repo_url: https://github.com/matbyte-com/vyhub-documentation
nav:
  - Welcome: index.md
  - "Getting Started":
    - getting_started/cloud.md
    - getting_started/selfhosting.md
  - "VyHub.net":
    - central/general.md
    - central/instance.md
    - central/custom_domain.md
    - central/account.md
    - central/affiliate.md
  - Guide:
    - Shop:
        - guide/shop/general.md
        - guide/shop/packet.md
        - guide/shop/payment_gateway.md
        - guide/shop/reward.md
        - guide/shop/tax.md
    - Groups/Ranks:
        - guide/group/group.md
        - guide/group/group_sync.md
        - guide/group/property.md
    - guide/adverts.md
    - guide/api.md
    - guide/ban_warning.md
    - guide/customizability.md
    - guide/forum.md
    - Import:
      - guide/import/general.md
      - guide/import/gextension.md
    - guide/html_pages.md
    - guide/legal.md
    - guide/navigation.md
    - guide/requirement_set.md
    - guide/server.md
    - guide/user.md
  - Integrations:
    - game/integrations.md
    - game/asa.md
    - game/discord.md
    - game/fivem.md
    - game/gmod.md
    - game/minecraft.md
    - game/rust.md
    - game/source.md
    - game/teamspeak.md
    - game/7days.md
  - For Developers:
    - dev/game_clients.md
    - dev/gmod.md
    - dev/selfhost_web.md
  - Changelog: changelog.md
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - content.action.view
extra_css:
  - stylesheets/extra.css
extra:
  version:
    provider: mike
plugins:
  - mike
  - search
  - redirects:
      redirect_maps:
        'quickstart.md': 'getting_started/cloud.md'
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
